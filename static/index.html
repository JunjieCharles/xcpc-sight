<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="XCPC rating 系列、比赛变化与参赛记录。">
  <title>XCPC Sight · Rating</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div>
      <h1>XCPC SIGHT</h1>
      <p class="site-subtitle">Series Rating</p>
    </div>
    <div class="site-links" aria-label="相关链接">
      <a href="https://github.com/JunjieCharles/xcpc-sight" target="_blank" rel="noopener noreferrer">
        <span class="site-link-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" focusable="false" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38v-1.34c-2.22.48-2.69-1.07-2.69-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.81.06 1.23.83 1.23.83.72 1.23 1.89.88 2.35.67.07-.52.28-.88.5-1.09-1.77-.2-3.64-.88-3.64-3.95 0-.88.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 4 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.08-1.87 3.75-3.66 3.95.29.25.54.73.54 1.48v2.19c0 .21.14.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </span>
        <span>GitHub 仓库</span>
      </a>
      <a href="https://qm.qq.com/q/q6c4s0YmGs" target="_blank" rel="noopener noreferrer">
        <span class="site-link-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" focusable="false" aria-hidden="true">
            <path d="M8 1C4.13 1 1 3.69 1 7c0 1.86.98 3.52 2.52 4.62L3 15l3.16-1.54c.6.12 1.21.18 1.84.18 3.87 0 7-2.69 7-6S11.87 1 8 1zm-2.5 5.3a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm2.5 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm2.5 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>
          </svg>
        </span>
        <span>QQ群 830590984</span>
      </a>
    </div>
  </header>

  <main id="main" tabindex="-1" class="app-layout">
    <aside class="series-sidebar" aria-labelledby="series-navigation-title">
      <p id="series-navigation-title" class="eyebrow">SERIES</p>
      <nav id="series-list" class="series-list" aria-label="Rating 系列"></nav>
    </aside>

    <div class="app-content">
      <section class="controls" aria-label="搜索">
        <label class="search-label">搜索参赛者或学校<input id="search-input" type="search" autocomplete="off" placeholder="输入参赛者名称或学校"></label>
        <p id="result-count" class="result-count" aria-live="polite"></p>
      </section>

      <div id="status" class="status" role="status">正在加载数据…</div>
      <section id="series-view" hidden aria-labelledby="series-title">
        <div class="section-heading">
          <div><p class="eyebrow">SERIES</p><h2 id="series-title"></h2></div>
          <p id="series-summary" class="section-note"></p>
        </div>
        <div class="table-shell" id="series-scroll" tabindex="0" aria-label="参赛者 rating 宽表，可水平和垂直滚动">
          <table class="data-table wide-table">
            <thead id="series-head"></thead>
            <tbody id="series-body"></tbody>
          </table>
        </div>
      </section>

      <section id="detail-view" hidden aria-labelledby="detail-title"></section>
    </div>
  </main>

  <template id="error-template"><div class="error-panel"><h2>无法显示数据</h2><p></p><button type="button">重试</button></div></template>
  <script type="module" src="./js/app.mjs"></script>
</body>
</html>
