<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="XCPC 个人 rating 系列、比赛变化与参赛记录。">
  <title>XCPC Sight · Rating</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div>
      <p class="eyebrow">XCPC SIGHT</p>
      <h1>个人 Rating</h1>
    </div>
    <p class="header-note">按实际参赛结果计算，缺席场次延续最近 rating。</p>
  </header>

  <main id="main" tabindex="-1">
    <section class="controls" aria-label="系列和搜索">
      <label>系列<select id="series-select"></select></label>
      <label class="search-label">搜索选手或学校<input id="search-input" type="search" autocomplete="off" placeholder="输入姓名或学校"></label>
      <p id="result-count" class="result-count" aria-live="polite"></p>
    </section>

    <div id="status" class="status" role="status">正在加载数据…</div>
    <section id="series-view" hidden aria-labelledby="series-title">
      <div class="section-heading">
        <div><p class="eyebrow">SERIES</p><h2 id="series-title"></h2></div>
        <p id="series-summary" class="section-note"></p>
      </div>
      <div class="table-shell" id="series-scroll" tabindex="0" aria-label="选手 rating 宽表，可水平和垂直滚动">
        <table class="data-table wide-table">
          <thead id="series-head"></thead>
          <tbody id="series-body"></tbody>
        </table>
      </div>
    </section>

    <section id="detail-view" hidden aria-labelledby="detail-title"></section>
  </main>

  <template id="error-template"><div class="error-panel"><h2>无法显示数据</h2><p></p><button type="button">重试</button></div></template>
  <script type="module" src="./js/app.mjs"></script>
</body>
</html>
