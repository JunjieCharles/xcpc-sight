      <circle cx="65" cy="91" r="3" fill="#fff" stroke="none"/>
    </g>
    <g id="balloon" stroke-width="5" transform="matrix(.54 .31 0 .58 10 35)">
      <ellipse cx="50" cy="39" rx="23" ry="27"/>
      <path d="m50 66-5 7h10Zm0 7c-12 9 12 13 0 22"/>
    </g>
    <g id="lightbulb" stroke-width="5" transform="matrix(.54 -.31 0 .58 64 66)">
      <path d="M38 65v-5c0-9-12-13-12-27a24 24 0 0 1 48 0c0 14-12 18-12 27v5ZM50 64V44m-8-7 8 7 8-7M39 77h22m-17 11h12"/>
