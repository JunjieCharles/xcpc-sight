<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">XCPC Sight</title>
  <desc id="desc">青色立方体，顶部是思考气泡，左侧是气球，右侧是灯泡。</desc>
  <!-- Match the site-header ink background; keep an opaque fill for browser tabs. -->
