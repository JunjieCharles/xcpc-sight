    <g id="thought-bubble" stroke-width="5" transform="matrix(.54 -.31 .54 .31 10 35)">
      <path d="M28 61C17 62 12 51 18 43C10 34 17 23 28 25C29 13 43 10 51 18C60 10 74 16 74 27C87 27 92 40 83 48C86 59 74 66 64 61C54 70 40 68 36 61Z"/>
