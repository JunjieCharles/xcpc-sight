[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xcpc-sight"
version = "0.1.0"
description = "Lightweight XCPC contest forecasting and data analysis tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "opencc-python-reimplemented>=0.1.7,<1",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
problem-rating = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "requests>=2.31,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.12,<2",
]
dev = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.9,<1",
    "scikit-learn>=1.5,<2",
    "scipy>=1.12,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/problem_rating", "src/rating"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
